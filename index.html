<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOPI — Sistema Operativo Personal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234772fa' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='9.2' opacity='.4'/%3E%3Cpath d='M7.5 12.4l3.1 3.1L17 9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/tasks.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/matrix.css">
<link rel="stylesheet" href="css/habits.css">
<link rel="stylesheet" href="css/pomodoro.css">
<link rel="stylesheet" href="css/countdown.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     PANTALLA 1 · AUTENTICACIÓN (registro / inicio de sesión)
     ══════════════════════════════════════════════════════════ -->
<section id="screen-auth" class="screen screen--auth">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.2" opacity=".35"></circle>
          <path d="M7.5 12.4l3.1 3.1L17 9"></path>
        </svg>
      </span>
      <div>
        <h1 class="auth-title">SOPI</h1>
        <p class="auth-sub">Tu Sistema Operativo Personal</p>
      </div>
    </div>

    <p class="auth-question">¿Qué tengo que hacer hoy?</p>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab is-active" data-auth-tab="login" role="tab">Iniciar sesión</button>
      <button class="auth-tab" data-auth-tab="register" role="tab">Crear cuenta</button>
    </div>

    <!-- Login -->
    <form id="form-login" class="auth-form" autocomplete="on" novalidate>
      <label class="field">
        <span class="field__label">Correo</span>
        <input type="email" name="email" placeholder="tu@correo.com" autocomplete="email" required>
      </label>
      <label class="field">
        <span class="field__label">Contraseña</span>
        <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </label>
      <p class="auth-error" data-error></p>
      <button type="submit" class="btn btn--primary btn--block">Entrar</button>
      <button type="button" class="auth-link is-hidden" id="btn-forgot">¿Olvidaste tu contraseña?</button>
    </form>

    <!-- Registro -->
    <form id="form-register" class="auth-form is-hidden" autocomplete="on" novalidate>
      <label class="field">
        <span class="field__label">Nombre</span>
        <input type="text" name="name" placeholder="Tu nombre" autocomplete="name" required>
      </label>
      <label class="field">
        <span class="field__label">Correo</span>
        <input type="email" name="email" placeholder="tu@correo.com" autocomplete="email" required>
      </label>
      <label class="field">
        <span class="field__label">Contraseña</span>
        <input type="password" name="password" placeholder="Mínimo 8 caracteres, con letras y números" autocomplete="new-password" required>
      </label>
      <p class="auth-error" data-error></p>
      <button type="submit" class="btn btn--primary btn--block">Crear mi cuenta</button>
    </form>

    <p class="auth-foot">Tu contraseña se guarda cifrada (PBKDF2) y tus datos viven solo en este navegador.</p>
  </div>
</section>

<!-- ══════════════════════════════════════════════════════════
     PANTALLA 2 · APLICACIÓN
     ══════════════════════════════════════════════════════════ -->
<main id="screen-app" class="screen screen--app is-hidden">

  <!-- Rail de módulos -->
  <nav class="rail" id="rail" aria-label="Módulos">
    <span class="rail__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9.2" opacity=".35"></circle>
        <path d="M7.5 12.4l3.1 3.1L17 9"></path>
      </svg>
    </span>
    <div class="rail__items" id="rail-items"><!-- generado por JS --></div>
    <button class="rail__btn rail__btn--user" id="btn-user" title="Cuenta">
      <span class="avatar" id="avatar">?</span>
    </button>
  </nav>

  <!-- Contenedor de vistas -->
  <div class="view" id="view"><!-- montado por cada módulo --></div>

  <!-- Menú de usuario -->
  <div class="popover is-hidden" id="user-menu">
    <div class="popover__head">
      <strong id="user-name">—</strong>
      <small id="user-email">—</small>
      <small class="popover__mode" id="user-mode">—</small>
    </div>
    <button class="popover__item is-hidden" id="btn-migrate">Subir mis datos de este navegador a la nube</button>
    <button class="popover__item" id="btn-export">Exportar mis datos (JSON)</button>
    <button class="popover__item popover__item--danger" id="btn-logout">Cerrar sesión</button>
  </div>
</main>

<div id="toasts" class="toasts"></div>

<!-- Librería de Supabase (solo hace falta en modo nube).
     Si no hay internet o no está configurado, SOPI sigue en modo local. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/query.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/errors.js"></script>
<script src="js/store.local.js"></script>
<script src="js/store.remote.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/modules/tasks.js"></script>
<script src="js/modules/calendar.js"></script>
<script src="js/modules/matrix.js"></script>
<script src="js/modules/habits.js"></script>
<script src="js/modules/pomodoro.js"></script>
<script src="js/modules/countdown.js"></script>
<script src="js/app.js"></script>
</body>
</html>
