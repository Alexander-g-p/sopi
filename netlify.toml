# ============================================================
# SOPI · configuración de Netlify
# Sitio estático: no hay que compilar nada.
#   Build command      : (vacío)
#   Publish directory  : .   (la carpeta con index.html)
# ============================================================

[build]
  publish = "."
  command = ""

# ------------------------------------------------------------
# Cabeceras de seguridad para todo el sitio
# ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Solo se cargan recursos del propio sitio. Sin scripts inline,
    # sin iframes ajenos, sin plugins.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    # Nadie puede meter SOPI dentro de un iframe (evita clickjacking)
    X-Frame-Options = "DENY"
    # El navegador no adivina tipos de archivo
    X-Content-Type-Options = "nosniff"
    # No filtramos la URL completa al salir del sitio
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HTTPS obligatorio durante un año
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # No pedimos cámara, micrófono ni ubicación
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Aislamiento entre pestañas
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# El HTML siempre fresco: así los cambios se ven al recargar
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS y JS siempre revalidados: al publicar un cambio se ve enseguida,
# sin tener que vaciar la caché del navegador
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ------------------------------------------------------------
# Cualquier ruta desconocida muestra la página 404 propia
# (Netlify usa 404.html automáticamente; esto lo deja explícito)
# ------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
